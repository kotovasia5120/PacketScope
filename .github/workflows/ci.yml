name: PacketScope CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
      - name: Verify pinned runtime and run tests
        run: make test
      - name: Build and install clean wheel
        run: |
          make wheel
          python -m venv /tmp/packetscope-wheel-check
          /tmp/packetscope-wheel-check/bin/python -m pip install --no-index --no-deps dist/packetscope-0.2.0-py3-none-any.whl
          /tmp/packetscope-wheel-check/bin/packetscope --help
      - name: Verify wheel bytes are reproducible
        run: |
          rm -rf /tmp/packetscope-wheel-a /tmp/packetscope-wheel-b
          SOURCE_DATE_EPOCH=315532800 python -m pip wheel --no-deps --no-build-isolation . --wheel-dir /tmp/packetscope-wheel-a
          SOURCE_DATE_EPOCH=315532800 python -m pip wheel --no-deps --no-build-isolation . --wheel-dir /tmp/packetscope-wheel-b
          test "$(sha256sum /tmp/packetscope-wheel-a/packetscope-0.2.0-py3-none-any.whl | cut -d' ' -f1)" = "$(sha256sum /tmp/packetscope-wheel-b/packetscope-0.2.0-py3-none-any.whl | cut -d' ' -f1)"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image (tests execute during build)
        run: docker build --tag packetscope:ci .
      - name: Repeat tests in an offline container
        run: docker run --rm --network none packetscope:ci make test
      - name: HTTP demonstration is separate from offline testing
        run: |
          docker run --rm --detach --name packetscope-http --publish 127.0.0.1:8765:8765 packetscope:ci
          trap 'docker rm --force packetscope-http' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then exit 0; fi
            sleep 1
           done
           exit 1

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned browser test dependency
        run: npm ci
      - name: Install pinned Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real Chromium acceptance tests
        run: npm run e2e
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packetscope-browser-artifacts
          path: test-artifacts/
