[build-system]
requires = []
build-backend = "packetscope.build_backend"
backend-path = ["."]

[project]
name = "packetscope"
version = "0.1.0"
description = "A local, explainable binary protocol reverse-engineering workbench."
readme = "README.md"
requires-python = "==3.12.7"
license = { text = "MIT" }
authors = [{ name = "PacketScope contributors" }]
dependencies = []

[project.scripts]
packetscope = "packetscope.cli:main"

[tool.packetscope]
max_upload_bytes = 268435456
max_packet_bytes = 16777216
max_packets = 100000
